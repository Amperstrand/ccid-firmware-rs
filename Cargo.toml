[workspace]
members = [
    "crates/ccid-protocol",
    "crates/card-interface",
    "crates/ccid-core",
    "crates/ccid-transport-serial",
    "crates/pn7160-nci",
    "crates/ccid-pcsc-host",
    "firmware/ccid-firmware",
    "firmware/esp32-ccid",
    "host-tools",
]
default-members = ["firmware/ccid-firmware"]
resolver = "2"

[patch.crates-io]
synopsys-usb-otg = { path = "vendor/synopsys-usb-otg" }
# Patched hal — canonical Amperstrand fork (issue #195; was a compiled
# vendor/ path-patch): ai-experiments = upstream v0.46.2 + legacy-i2c
# opt-in (issues #63/#80) + IDF v5.5.5 sd.rs backport. Rev pinned by
# Cargo.lock. Rebase/drop when upstream >=0.48 ships equivalents.
esp-idf-hal = { git = "https://github.com/Amperstrand/esp-idf-hal", branch = "ai-experiments" }

[profile.release]
debug = 2
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.esp32-ccid]
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1
