[package]
name = "boards"
version = "0.1.0"
edition = "2021"
description = "Board tables as const data — one home for pin/bus maps, NFC peripheral facts, capabilities, and OTA-partition family (docs/BOARDS-AS-DATA-DESIGN.md)"
license = "GPL-2.0-or-later"

# Layer A of the boards-as-data design: pure, core-only const data.
# No HAL deps, no build-dep, no alloc — must compile on the host (CI
# host-union-check legs), xtensa/riscv espidf, and cortex-m alike.
# Consumed by the firmware bins (esp32-ccid, ccid-firmware) and by
# tooling/CI — NEVER by ccid-service (the #383 board-blind boundary;
# adding a dep here would fail tools/union_matrix.py check).
[dependencies]
