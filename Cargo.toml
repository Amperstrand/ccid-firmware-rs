[workspace]
members = [
    "crates/ccid-protocol",
    "crates/card-interface",
    "crates/ccid-core",
    "crates/ccid-transport-serial",
    "crates/pn7160-nci",
    "crates/ccid-pcsc-host",
    "firmware/ccid-firmware",
    "firmware/esp32-ccid",
    "host-tools",
]
default-members = ["firmware/ccid-firmware"]
resolver = "2"

[patch.crates-io]
# synopsys-usb-otg: retired from vendor/ to the canonical fork (#264) —
# byte-identical source, rev-pinned. Upstream has no F469 feature and
# crates.io is stuck at 0.5.0; the fork carries F469 USB endpoint
# re-enablement + generated-RAL warning suppression. Vendoring-policy
# class 2: the patch lives in a git dep, not vendor/.
synopsys-usb-otg = { git = "https://github.com/Amperstrand/synopsys-usb-otg", rev = "764bc042f63cf00d0efd2417141438c1584cd187" }
# esp-idf-hal rides crates.io again (#149 P3): the Amperstrand fork's
# only delta was the `legacy-i2c` opt-in, whose last consumers
# (backend-mfrc522, the m5stick LCD's AXP192) moved to the shared
# driver_ng embedded-hal adapter in pn7160-nci::hal_i2c.

# Patched BSP — ⚠️ AUDIT 2026-10-18 (docs/VENDOR_PATCH_AUDIT.md #2): this
# vendor copy is a STRANDED SNAPSHOT of the fork's DELETED `sdio-support`
# branch (fa6dc86 era) + HAL-pin realignment to 05d999d (issue #193 — the
# fork's `main` pins an older HAL rev, two instances broke display-init
# Pin/Rcc types). The patch is currently the SOLE PROVIDER of the BSP: the
# dep's declared `branch = "sdio-support"` no longer exists on the remote.
# Clean path (bench-gated): branch off fork main with the HAL-pin bump,
# port the display feature onto it, bench-verify per #193, then point the
# dep at that branch and DELETE this patch + the vendor tree.
[patch."https://github.com/Amperstrand/stm32f469i-disc.git"]
stm32f469i-disc = { path = "vendor/stm32f469i-disc" }

[profile.release]
debug = 2
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.esp32-ccid]
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1
