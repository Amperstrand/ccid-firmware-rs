# greatspectations spec-quote drift config for ccid-firmware-rs
#
# Tool: https://github.com/rustyrussell/greatspectations
#
# The USB CCID Rev 1.1 specification itself is a PDF with no canonical
# text source. The closest tracked text sources are used instead:
#
#   CCID_SPEC   — osmo-ccid-firmware protocol definitions (CCID Rev 1.1
#                 message types, structures, status/error constants)
#   CCID_SERIAL — libccid's GemPC Twin serial driver (framing, echo,
#                 escape commands, descriptor values)
#   GEMPC       — the authoritative GemPC Twin serial reader descriptor
#   PCSC        — pcsc-lite's host-side PIN structures: what pcscd
#                 actually puts in PC_to_RDR_Secure payloads
#   LIBCCID     — libccid's PC/SC → CCID byte translation loops (the
#                 on-wire field order/omission rules)
#   ISO7816     — osmo's ISO 7816-3 tables (@implements annotations),
#                 the Fi/Di/fmax authority for ATR parsing
#   CCID_DEFS   — libccid's driver structures/constants (ccid.h): the
#                 GEMALTO_FIRMWARE_FEATURES layout the 0x6A escape answers
#   PCSCD       — pcscd's daemon constants (pcscd.h.in): poll cadence,
#                 power-off grace, event timeouts (#141 host contract)
#
# All live in git submodules under reference/ (CI checks out with
# submodules: true; locally run `git submodule update --init` first).
#
# Comment marker syntax in Rust source:
#   // CCID_SPEC:   <verbatim quote from ccid_proto.h>
#   // CCID_SERIAL: <verbatim quote from ccid_serial.c>
#   // GEMPC:       <verbatim quote from GemPCTwinSerial.txt>
#   // PCSC:        <verbatim quote from reference/CCID/MacOSX/reader.h>
#   // LIBCCID:     <verbatim quote from reference/CCID/src/commands.c>
#   // ISO7816:     <verbatim quote from iso7816_3.c>
#
# Run (from repo root):
#   python3 -m greatspectations check --config specquotes.toml \
#       --comment-start '// ' --comment-continue '//' -k \
#       $(git ls-files 'crates/*/src/*.rs' 'firmware/*/src/*.rs')
#
# Quotes are whitespace-normalized: consecutive `//` continuation lines
# join into one quote, `...` acts as a wildcard. Keep quote blocks
# separated from other comments by a blank line.

[sources.CCID_SPEC]
format = "markdown"
file = "reference/osmo-ccid-firmware/ccid_common/ccid_proto.h"
comment_marker = "CCID_SPEC"

[sources.CCID_SERIAL]
format = "markdown"
file = "reference/CCID/src/ccid_serial.c"
comment_marker = "CCID_SERIAL"

[sources.GEMPC]
format = "markdown"
file = "reference/CCID/readers/GemPCTwinSerial.txt"
comment_marker = "GEMPC"

[sources.PCSC]
format = "markdown"
file = "reference/CCID/MacOSX/reader.h"
comment_marker = "PCSC"

[sources.LIBCCID]
format = "markdown"
file = "reference/CCID/src/commands.c"
comment_marker = "LIBCCID"

[sources.ISO7816]
format = "markdown"
file = "reference/osmo-ccid-firmware/ccid_common/iso7816_3.c"
comment_marker = "ISO7816"

[sources.CCID_DEFS]
format = "markdown"
file = "reference/CCID/src/ccid.h"
comment_marker = "CCID_DEFS"

[sources.PCSCD]
format = "markdown"
file = "reference/pcsc-lite/src/pcscd.h.in"
comment_marker = "PCSCD"
