## ccid-firmware bench exporter: the two ESP32 OTA seats.
##
## Run by the SYSTEM unit labgrid-exporter-ccid.service on the bench host
## (.208) against the ai-legion coordinator 127.0.0.1:20408 — config
## deployed to /etc/labgrid/exporter-ccid.yaml (converted 2026-10-14 from
## a --user unit whose config lived in an ephemeral worktree; resources +
## place acquire re-verified after the swap). Deploying an edit: copy this
## file to /etc/labgrid/exporter-ccid.yaml on .208 and
## `systemctl restart labgrid-exporter-ccid` — same session, per the
## conwrt-bench config-sync rule.
## Exporter name: ai-legion-ccid (bolty-rs tools/hil lineage; the bench's
## serial/USB-identity exporter ai-legion-nfc stays untouched).
##
## DTR HAZARD — read before adding matches. '#' lines are Jinja statements
## in exporter configs (labgrid line_statement_prefix); comment with '##'.
##
## USBSerialPort is ser2net-served ON ACQUIRE (labgrid 26.0
## SerialPortExport): acquiring a place that matches one OPENS the port,
## and opening /dev/ttyACM0 chip-resets the nucula
## (docs/VPCD_WIFI_RUNBOOK.md: "USB serial is only needed for recovery").
## The ccid-nucula / ccid-m5stick places therefore match NetworkService
## ONLY; the USBSerialPort entries below are enrollment records for
## future console places (add the match only when the bench is free and
## a console session is intended — under the bench flock, README §4).
##
## The same physical ports are ALSO exported as pure acquisition tokens
## by the system exporter ai-legion-nfc (groups nucula-c3 / m5stick-usb,
## plain SerialPort class — no ser2net on acquire). Two token families
## for one port do not exclude each other BY THEMSELVES — since
## 2026-10-14 the cross-place exclusion is COORDINATOR-ENFORCED by
## matching each NetworkService below into its USB sibling place:
##   m5stick    matches ai-legion-ccid/m5stick/NetworkService   (live, verified)
##   nucula-c3  matches ai-legion-ccid/nucula/NetworkService   (live, verified
##     2026-10-14 — after release -k of a 1h13m leaked hold: no port holders,
##     no nucula processes, sibling session active on other lanes)
## Acquiring either place of a pair now acquires the shared resource and
## the coordinator refuses the sibling ("Matching resource ... already
## acquired"). The bench flock (/tmp/amperstrand-bench.lock,
## tests/hardware/labgrid/bench.py bench_lock, AB-BA: flock first)
## remains for cross-project serial discipline.
##
## Paths are /dev/serial/by-id — stable across reboots and replug seat
## changes (busnum/devnum and ttyNX names drift). Verified live
## 2026-10-13: ttyACM0 -> Espressif 90:DA:72:9A:50:18 (nucula USB JTAG),
## ttyUSB0 -> Hades2001 M5stack 49D6163EBE (CP210x).

nucula:
  ## ESP-IDF OTA endpoint (VPCD_WIFI_RUNBOOK: rollback-hardened, :3232).
  ## username is a required NetworkService field but inert here — the OTA
  ## service is not SSH; 'ota' marks intent. The vpcd link (:35963) is
  ## OUTBOUND — the board connects to the host listener — so it needs no
  ## exporter-side resource; documented in tools/hil/README.md §6 instead.
  NetworkService:
    address: 192.168.13.230
    port: 3232
    username: ota
  USBSerialPort:
    port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:DA:72:9A:50:18-if00
    speed: 115200

m5stick:
  ## Same firmware family, own OTA endpoint and vpcd slot (:35964).
  NetworkService:
    address: 192.168.13.234
    port: 3232
    username: ota
  USBSerialPort:
    port: /dev/serial/by-id/usb-Hades2001_M5stack_49D6163EBE-if00-port0
    speed: 115200
