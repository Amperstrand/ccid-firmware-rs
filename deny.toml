# cargo-deny configuration (supply-chain gate, research 2026-10-17).
# Checked by .github/workflows/deny.yml on dependency-manifest changes
# and weekly (advisory DB moves even when manifests don't).

[advisories]
# yanked crates are an immediate reproducibility hazard for the bench
# fleet (exact toolchain pins doctrine) — fail on them.
yanked = "deny"
# unmaintained is informational for a firmware tree this size; a
# maintained fork swap is a lane, not an emergency patch. ("none" = no
# crate set triggers; tighten to "workspace" once the first pass is
# triaged.)
unmaintained = "none"
# RUSTSEC ignores need a reason each — none today.

[licenses]
# This project is GPL-2.0-or-later; the allow-list is EXACTLY the
# union the dependency tree carries (verified with `cargo deny check
# licenses` 2026-10-17) — adding a dep under a new license means
# adding it here, deliberately, in the same change.
# NOTE: GPL-3.0-or-later entries are the Amperstrand iso14443-rs /
# mfrc522-rs / bolty-rs mfrc522-pcd forks — pre-existing pins, made
# visible by this gate. Compatibility is one-way fine for a
# GPL-2.0-or-later project (2+ upgrades to 3+).
allow = [
  "GPL-2.0-or-later",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
# duplicate versions are a fact of cargo life; surfaced as warnings so
# the weekly run trends them without blocking merges.
multiple-versions = "warn"
deny = []
# Keep vendor/ and path deps first-party by construction; no wildcard
# bans for now.
#
# Remaining duplicate families, justified (cargo-deny all-targets view,
# refreshed 2026-10-18 with the heapless 0.9 unification — evidence on
# issue #263). Three groups + one open lane:
#
# 1. embuild 0.33.5 build chain — esp-idf-sys 0.38.1 pins embuild 0.33
#    and 0.33.5 is crates.io max (2026-10-18), so this chain is the
#    ceiling until esp-idf-sys moves. Host-side build-dependencies only,
#    never compiled into any firmware target:
#      bitflags 1.3.2, syn 1.0.109 (via strum_macros 0.24),
#      thiserror/-impl 1.0.69, rustix 0.38 (via which 4),
#      linux-raw-sys 0.4, semver 0.9
# 2. Cross-project shared-fork pins (doctrine D-9 — their dependency
#    choices are the forks' call, not this repo's):
#      heapless 0.8 (mfrc522 fork @e9ced1e — sole 0.8 consumer left
#        after the in-repo crates unified on 0.9),
#      embedded-hal/embedded-io/nb/bare-metal 0.2-generation
#        (cortex-m/ft6x06/stm32f4xx-hal-fork chain),
#      rand_core 0.6
# 3. Host-toolchain-only noise (never on any firmware target):
#      windows-sys (x3), wit-bindgen (x2)
# 4. defmt 0.3 + panic-probe 0.3 vs 1.x — the STM32 debug-stack refresh
#    (#262) owns this; NOT a permanent fixture, do not re-justify here.

[sources]
# crates.io + the deliberate git pins ONLY (the Amperstrand forks
# documented in README/AGENTS + the two third-party pins the esp32
# tree carries: stm32f4xx-hal fork patch, ft6x06 touch controller).
# A NEW git dependency must be added here with its justification —
# that is the entire point of this gate.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/Amperstrand/bolty-rs",
  "https://github.com/Amperstrand/iso14443-rs",
  "https://github.com/Amperstrand/mfrc522-rs",
  "https://github.com/Amperstrand/stm32f4xx-hal",
  "https://github.com/DougAnderson444/ft6x06",
]
