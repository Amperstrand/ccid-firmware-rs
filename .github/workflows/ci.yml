name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run (new push to the same branch/PR) is cancelled instead of
# burning a full obsolete matrix run behind the newest commit.
concurrency:
  # PRs: group per ref — a superseded push cancels the in-flight run.
  # Main: group per SHA — GitHub's queue keeps only ONE pending run per
  # group and REPLACES it when the next arrives, so a shared main group
  # lets a later docs-only push replace (and discard) a queued code push
  # whose cache-save this workflow exists to protect (Codex review on #74).
  # Per-SHA groups are never cancelled or replaced; every main push runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stm32: ${{ steps.filter.outputs.stm32 }}
      esp32: ${{ steps.filter.outputs.esp32 }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@v5
      # Path sets follow what each job group actually consumes (esp32-ccid and
      # host-tools are root-workspace members, so cross-effects exist):
      # - stm32: ccid-firmware, shared crates, host-tools (its tests run via
      #   `cargo test --workspace`), vendored synopsys-usb-otg patch, root
      #   manifest/lock
      # - esp32: esp32-ccid + its crates/ path deps, root manifest/lock
      # - lint: paths only stm32-lint validates — Rust sources of any
      #   workspace member (`cargo fmt --check` is workspace-wide), plus the
      #   shell/python helpers it syntax-checks
      # Jobs stay defined when filtered out (skipped == success for branch
      # protection); only their execution is skipped.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            stm32:
              - 'firmware/ccid-firmware/**'
              - 'crates/**'
              - 'host-tools/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            esp32:
              - 'firmware/esp32-ccid/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            lint:
              - 'firmware/ccid-firmware/**/*.rs'
              - 'firmware/esp32-ccid/**/*.rs'
              - 'crates/**/*.rs'
              - 'host-tools/**/*.rs'
              - 'firmware/esp32-ccid/*.sh'
              - 'firmware/esp32-ccid/s_check_sdkconfig'
              - 'tools/**'
              - 'tests/**'
              - 'host-tools/*.py'

  stm32-build:
    needs: changes
    if: needs.changes.outputs.stm32 == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: profile-cherry-smartterminal-st2xxx
            features: ""
          - profile: profile-gemalto-idbridge-ct30
            features: "stm32f469,profile-gemalto-idbridge-ct30"
          - profile: profile-gemalto-idbridge-k30
            features: "stm32f469,profile-gemalto-idbridge-k30"
          - profile: stm32f746-bitbang
            features: "stm32f746,profile-cherry-smartterminal-st2xxx"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: thumbv7em-none-eabihf

      - name: Install cargo-binutils
        run: |
          rustup component add llvm-tools
          cargo install cargo-binutils

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Build firmware
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo build --release --target thumbv7em-none-eabihf
          else
            cargo build --release --target thumbv7em-none-eabihf --no-default-features --features ${{ matrix.features }}
          fi
      
      - name: Generate binary artifacts
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo objcopy --release -- -O binary ccid-firmware.bin
            cargo objcopy --release -- -O ihex ccid-firmware.hex
          else
            cargo objcopy --release --no-default-features --features ${{ matrix.features }} -- -O binary ccid-firmware.bin
            cargo objcopy --release --no-default-features --features ${{ matrix.features }} -- -O ihex ccid-firmware.hex
          fi
          sha256sum ccid-firmware.bin > ccid-firmware.bin.sha256
          sha256sum ccid-firmware.hex > ccid-firmware.hex.sha256
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: |
            ccid-firmware.bin
            ccid-firmware.hex
            ccid-firmware.bin.sha256
            ccid-firmware.hex.sha256

  esp32-build:
    needs: changes
    if: needs.changes.outputs.esp32 == 'true'
    # The esp32-ccid package had no CI coverage at all: broken builds for
    # individual variants (and silently-skipped sdkconfig defaults) only
    # surfaced on the bench. Builds every variant and runs the sdkconfig
    # gate (s_check_sdkconfig) on one of them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: m5stick
            features: "backend-mfrc522,board-m5stick"
            no-default-features: true
            gate: true
            toolchain: esp
            profile: "--release"
            target: xtensa-esp32-espidf
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32"
            sdkconfig_full: false
          - name: m5atom-default
            features: ""
            no-default-features: false
            gate: false
            toolchain: esp
            profile: "--release"
            target: xtensa-esp32-espidf
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32"
            sdkconfig_full: false
          - name: pn532
            features: "backend-pn532"
            no-default-features: true
            gate: false
            toolchain: esp
            profile: "--release"
            target: xtensa-esp32-espidf
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32"
            sdkconfig_full: false
          # C3/nucula (issue #70): riscv32imc-esp-espidf via nightly + build-std,
          # on the BENCH sdkconfig.full flow (coredump partition, USB-JTAG
          # console — CI validates the config the bench actually ships) rather
          # than a defaults approximation. The partition CSV reaches the
          # esp-idf project dir via ESP_IDF_GLOB_* (esp-idf-sys BUILD-OPTIONS:
          # copied by the build script before cmake configure — fresh-runner
          # safe, no manual out-dir copies). Debug profile = bench parity.
          - name: c3-nucula-bringup
            features: "pn7160-bringup,pn7160-verdict-b"
            no-default-features: true
            gate: false
            toolchain: nightly
            profile: ""
            target: riscv32imc-esp-espidf
            sdkconfig: "sdkconfig.full"
            sdkconfig_full: true
          # The nucula CCID main — the bench-shipped reader firmware
          # (build.sh c3-ccid): carries the USB-CDC serve loop, the
          # Escape 0xD1 snapshot trigger, and the coredump config that
          # the dump-and-retrieve workflow depends on. Target-compile
          # coverage so regressions surface in CI, not on the bench.
          - name: c3-nucula-ccid
            features: "pn7160-ccid"
            no-default-features: true
            gate: false
            toolchain: nightly
            profile: ""
            target: riscv32imc-esp-espidf
            sdkconfig: "sdkconfig.full"
            sdkconfig_full: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip python3-venv libssl-dev libffi-dev
          pip install --user pyelftools

      - name: Install ldproxy
        run: |
          cargo install ldproxy

      - name: Install espup + espflash (xtensa only)
        if: matrix.toolchain == 'esp'
        run: |
          cargo install espup espflash

      # Cache the cargo target dir too: esp-idf-sys compiles the whole ESP-IDF
      # C framework + Rust std (-Z build-std) there — the dominant ~80% of
      # build time that previously recompiled on every run. embuild's IDF
      # clone + self-provisioned tools ride along BUT in one of TWO places
      # depending on the flow (Codex review on #76): the nightly/C3 path puts
      # them under target/.embuild, the espup/Xtensa path under the repo-root
      # .embuild — both paths are cached.
      #
      # Path note: esp32-ccid is a member of the ROOT cargo workspace, so its
      # artifacts land in the repo-root target/ (same dir s_check_sdkconfig
      # reads), NOT firmware/esp32-ccid/target.
      #
      # Budget note: GitHub evicts at 10 GB per repo (LRU). Each matrix entry
      # stores a full target dir + ~/.espressif copy (~1-1.5 GB compressed
      # each), so this table can hold ~4-5 GB on its own. Keep key inputs
      # minimal; stale entries age out via LRU.
      - name: Cache espressif tools + esp32 target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            target
            .embuild
          # Do not cache ~/.cargo/bin: cargo-installed tools are provisioned
          # explicitly above and a cached binary can silently outlive its
          # requested version. Per-variant key on the manifests, toolchain,
          # SDK configuration, and partition table; fallback
          # chain: any prior hash of the same variant, then the pre-target
          # tools-only cache (keeps the ~/.espressif benefit on misses).
          # KEY-VERSION RULE: bump v4→v5 when the ESP-IDF pin changes — a
          # restored target dir built against a different IDF dies at cmake
          # configure with a source-directory mismatch (observed when a
          # v5.2.3 experiment cache poisoned v5.2.4 runs; failed jobs still
          # save their cache, which is how the poison spreads).
          key: espressif-${{ runner.os }}-v5-${{ matrix.name }}-${{ matrix.toolchain }}-${{ matrix.target }}-${{ hashFiles('firmware/esp32-ccid/Cargo.toml', '**/Cargo.lock', 'firmware/esp32-ccid/sdkconfig*', 'firmware/esp32-ccid/partitions-ota.csv', 'rust-toolchain.toml') }}
          restore-keys: |
            espressif-${{ runner.os }}-v5-${{ matrix.name }}-${{ matrix.toolchain }}-${{ matrix.target }}-
            espressif-${{ runner.os }}-v5-${{ matrix.name }}-
            espressif-${{ runner.os }}-v5-

      - name: Install ESP toolchain (xtensa)
        if: matrix.toolchain == 'esp'
        run: |
          # Pin the crosstool GCC to what IDF v5.5.1's tool_version_check
          # accepts ('esp-14.2.0_20241119'). espup installs the LATEST
          # crosstool by default; its bin dir lands ahead of embuild's own
          # copy in PATH, and a brand-new release (esp-16.2.0_20260914,
          # 2026-10-09) made every xtensa matrix entry fail the IDF
          # version check at cmake configure time.
          espup install -c 14.2.0_20241119
          . ${HOME}/export-esp.sh
          rustup component add rustfmt --toolchain esp || true

      - name: Install nightly toolchain (riscv/C3)
        if: matrix.toolchain == 'nightly'
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Build firmware (${{ matrix.name }})
        working-directory: firmware/esp32-ccid
        run: |
          # xtensa toolchain env (espup) — harmless no-op for the C3/nightly
          # variant, which self-provisions everything under .embuild.
          [ "${{ matrix.toolchain }}" = "esp" ] && . ${HOME}/export-esp.sh
          # sdkconfig defaults only apply via this env var (metadata paths are
          # dropped silently by esp-idf-sys) — without it the build succeeds with
          # IDF defaults and the gate below fails. Bench flow: flash_and_test.sh
          # (xtensa) / build.sh (c3, sdkconfig.full + custom partitions).
          if [ "${{ matrix.sdkconfig_full }}" = "true" ]; then
            export ESP_IDF_SDKCONFIG="$PWD/${{ matrix.sdkconfig }}"
            export ESP_IDF_GLOB_PARTCSV_BASE="$PWD"
            export ESP_IDF_GLOB_PARTCSV_1="/partitions-ota.csv"
          else
            export ESP_IDF_SDKCONFIG_DEFAULTS="$PWD/${{ matrix.sdkconfig }}"
          fi
          if [ "${{ matrix.no-default-features }}" = "true" ]; then
            cargo +${{ matrix.toolchain }} build ${{ matrix.profile }} --target ${{ matrix.target }} --no-default-features --features "${{ matrix.features }}"
          else
            cargo +${{ matrix.toolchain }} build ${{ matrix.profile }} --target ${{ matrix.target }}
          fi

      - name: sdkconfig gate
        if: matrix.gate
        working-directory: firmware/esp32-ccid
        run: |
          . ${HOME}/export-esp.sh
          ./s_check_sdkconfig

  stm32-lint:
    needs: changes
    if: needs.changes.outputs.stm32 == 'true' || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: thumbv7em-none-eabihf
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (F469 default)
        run: cargo clippy --release --target thumbv7em-none-eabihf -- -D warnings

      - name: Run clippy (F746 bitbang)
        run: cargo clippy --release --target thumbv7em-none-eabihf --no-default-features --features "stm32f746,profile-cherry-smartterminal-st2xxx" -- -D warnings

      - name: Check Python syntax
        run: |
          python3 -m py_compile tests/hardware/*.py host-tools/*.py \
            tests/hardware/labgrid/conftest.py tests/hardware/labgrid/test_ccid_hil.py

      - name: Check shell syntax
        run: |
          bash -n tools/switch_role.sh \
            firmware/esp32-ccid/flash_and_test.sh firmware/esp32-ccid/s_check_sdkconfig \
            firmware/esp32-ccid/build.sh

  stm32-test:
    needs: changes
    if: needs.changes.outputs.stm32 == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: x86_64-unknown-linux-gnu
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run workspace tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

  esp32-host-test:
    needs: changes
    if: needs.changes.outputs.esp32 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-ccid
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware/esp32-ccid -> target

      - name: Run ESP32 host-side tests
        run: cargo test --target x86_64-unknown-linux-gnu

      # The pn7160 backend (bring-up driver + NCI adapter, incl. the health
      # -check accessors) compiles only under its feature — without this
      # invocation its 53 tests never run in CI.
      - name: Run ESP32 host-side tests (backend-pn7160)
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features backend-pn7160
