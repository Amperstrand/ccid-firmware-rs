[package]
name = "ccid-core"
rust-version = "1.98"
version = "0.1.0"
edition = "2021"
description = "Shared CCID command handling utilities for smartcard reader firmware"
license = "GPL-2.0-or-later"

[features]
default = []
std = []

[dependencies]
ccid-protocol = { path = "../ccid-protocol" }
card-interface = { path = "../card-interface" }
# default-features off: the crate builds for no_std targets (STM32) where
# no logger is installed — the macros compile to no-ops there.
log = { version = "0.4", default-features = false }
