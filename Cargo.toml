[workspace]
members = [
    "crates/ccid-protocol",
    "crates/card-interface",
    "crates/ccid-core",
    "crates/ccid-transport-serial",
    "crates/pn7160-nci",
    "crates/ccid-pcsc-host",
    "firmware/ccid-firmware",
    "firmware/esp32-ccid",
    "host-tools",
]
default-members = ["firmware/ccid-firmware"]
resolver = "2"

[patch.crates-io]
synopsys-usb-otg = { path = "vendor/synopsys-usb-otg" }
# Patched hal — canonical Amperstrand fork (issue #195): ai-experiments-0.47
# = the legacy-i2c opt-in (issues #63/#80) + sd.rs backport, rebased onto
# upstream v0.47.0 (2026-10-15 unification wave; the sd.rs backport hunks
# were redundant there — upstream already carries the field). Rev pinned by
# Cargo.lock. Drop when upstream >=0.48 ships legacy-i2c equivalents.
esp-idf-hal = { git = "https://github.com/Amperstrand/esp-idf-hal", branch = "ai-experiments-0.47" }

# Patched BSP — local copy of Amperstrand/stm32f469i-disc sdio-support
# (fa6dc86) with its HAL dep realigned to this repo's pin 05d999d (the BSP
# pins ancestor 789e5e8; two HAL instances made display-init Pin/Rcc types
# from different crates — issue #193). Lift to a BSP branch when pushing.
[patch."https://github.com/Amperstrand/stm32f469i-disc.git"]
stm32f469i-disc = { path = "vendor/stm32f469i-disc" }

[profile.release]
debug = 2
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.esp32-ccid]
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1
