[package]
name = "mfrc522-pcd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MFRC522 PcdTransceiver for ISO 14443 — kernel crate homed in ccid-firmware-rs (M2 one-way kernel, migrated from bolty-rs 2026-10-21); bolty-rs consumes via git pin"

[dependencies]
# Rev-strings MUST stay byte-identical to firmware/esp32-ccid's pins —
# differing strings (short vs full sha) split the dependency graph into
# two crate versions and the PcdTransceiver traits stop unifying
# (bench lesson, 2026-10-21).
iso14443 = { git = "https://github.com/Amperstrand/iso14443-rs.git", rev = "0f7d9d70", features = ["alloc"] }
mfrc522 = { git = "https://github.com/Amperstrand/mfrc522-rs.git", rev = "e9ced1e" }
embedded-hal = "=1.0.0"
log = "=0.4.29"

# #447: both embedded archs (esp32 xtensa + esp32c3 riscv32) — bus
# recovery is arch-neutral and the nucula path needs it too.
[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
# Pinned to match the workspace firmware crates so a single esp-idf-sys
# instance is shared across the dependency graph.
esp-idf-sys = "0.38"
