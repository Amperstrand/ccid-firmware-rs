[package]
name = "pn7160-nci"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "no_std NCI protocol core for the PN7160 NFC controller (reader mode bring-up + framing), with mock-transport unit tests"
# Host-testable protocol core; the esp-idf I2C/CardBackend binding lives in
# firmware/esp32-ccid and consumes this crate.

[dependencies]
heapless = "0.8"
# Single wire-format source for the CCID time-extension bError (the
# WTX-budget composition contract consumes it — Codex P2 on #236).
ccid-protocol = { path = "../ccid-protocol" }

[features]
default = ["std"]
std = []
