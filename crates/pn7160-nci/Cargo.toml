[package]
name = "pn7160-nci"
rust-version = "1.98"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "no_std NCI protocol core for the PN7160 NFC controller (reader mode bring-up + framing), with mock-transport unit tests"
# Host-testable protocol core; the esp-idf I2C/CardBackend binding lives in
# firmware/esp32-ccid and consumes this crate.

[dependencies]
heapless = "0.9"
# embedded-hal 1.0 traits are no_std + host-safe: unconditional so the
# driver_ng adapter's pure mapping logic stays host-testable (#149 P3).
embedded-hal = "1.0"

# #149 P1: the bench-proven ESP32 transport (esp-idf FFI) behind an
# opt-in feature — host/protocol consumers build none of it. Versions
# match firmware/esp32-ccid exactly (one generation across the tree).
[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
esp-idf-sys = { version = "0.38", optional = true, features = ["binstart"] }
esp-idf-hal = { version = "0.47", optional = true }
log = { version = "0.4", optional = true }

[features]
default = ["std"]
std = []
esp = ["dep:esp-idf-sys", "dep:esp-idf-hal", "dep:log"]
# Experiment: never cycle VEN (assumes the chip is alive at handover).
# The firmware's pn7160-ven-never forwards here — cargo features are
# package-scoped, so the cfg must live behind THIS crate's feature
# (Codex review on #230).
ven-never = []
