# HIL bench nightly (issue #183): device-in-the-loop testing on the
# ai-legion bench via the self-hosted `bench` runner, plus generated
# STATUS.md on the bench/status branch.
#
# SECURITY (public repo + root runner — read before editing triggers):
#   This workflow MUST NOT run pull_request/pull_request_target events.
#   Fork PR code would execute on the bench host as root. schedule and
#   workflow_dispatch only (dispatch requires repo write access).
#   The runner tradeoffs are documented on issue #183.

name: hil-bench

on:
  schedule:
    - cron: '17 3 * * *'  # nightly, off-peak minutes
  workflow_dispatch:
    inputs:
      rollup_issues:
        description: "Comma-separated issue numbers for the STATUS rollup (empty = none)"
        required: false
        default: ''

permissions:
  contents: read

env:
  # F469 ST-LINK is physically detached (2026-10-14): its place fails
  # acquire → the suite skips it loudly. Revisit when re-attached.
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bench-health:
    runs-on: [self-hosted, bench]
    name: bench inventory
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'false' }
      - name: bench_inventory.py --json
        id: inv
        run: |
          set +e
          python3 tests/hardware/labgrid/bench_inventory.py --json > inventory.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0   # inventory failure must not cancel the HIL attempt — the
                   # suites skip what they cannot reach and record the rest
      - name: inventory summary
        if: always()
        run: |
          {
            echo '## Bench inventory'
            echo '```json'
            cat inventory.json 2>/dev/null || echo '{"error": "inventory run produced no output"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-inventory, path: inventory.json }

  hil:
    runs-on: [self-hosted, bench]
    name: HIL suites (on-device)
    needs: bench-health
    if: always() && needs.bench-health.result != 'cancelled'
    # Hard job timeout on top of per-test timeouts: even a
    # timeout-surviving wedge (thread-method can't kill C extensions)
    # costs one red nightly, never the runner indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { submodules: 'false' }
      - name: run labgrid HIL suites
        # Per-test timeout (pytest-timeout, bench-verified installed), signal
        # method: bench-proven necessary — the thread method cannot kill a
        # C-level select() (first widened nightly 2026-10-14 lost the whole
        # run + junit to exactly that) while SIGALRM interrupts it (EINTR)
        # and the run continues. GP lifecycle is
        # EXCLUDED unattended — GP attempts are card-budget-bearing
        # (AGENTS.md Card-Handling Doctrine); automating it needs
        # explicit owner sign-off (#183).
        run: >
          python3 -m pytest tests/hardware/labgrid/ -v --hil
          --ignore=tests/hardware/labgrid/test_gp_lifecycle_hil.py
          --timeout=240 --timeout-method=signal
          --junitxml=hil-junit.xml
      - name: junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: hil-junit, path: hil-junit.xml }

  status:
    runs-on: ubuntu-latest
    name: publish STATUS.md
    needs: [bench-health, hil]
    if: always() && needs.bench-health.result != 'skipped'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: generate STATUS.md
        run: |
          mkdir -p docs
          inv=$(ls artifacts/bench-inventory/inventory.json 2>/dev/null || true)
          junit=$(ls artifacts/hil-junit/hil-junit.xml 2>/dev/null || true)
          python3 scripts/gen_status.py \
            --inventory "${inv:-/dev/null}" \
            --junit "${junit:-/dev/null}" \
            --commit "$GITHUB_SHA" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # #183 drift layer: firmware landed since the previous bench
          # stamp makes those claims stale — fetch full history (Codex
          # P1: the stamp SHA must resolve for the ancestor check),
          # parse the PUBLISHED bench/status stamp, diff to HEAD.
          git fetch --unshallow -q origin || git fetch -q origin \
            '+refs/heads/*:refs/remotes/origin/*' || true
          git fetch -q origin refs/heads/bench/status || true
          PREV_STATUS_SHA=$(git show FETCH_HEAD:docs/STATUS.md 2>/dev/null \
            | grep -m1 -oP 'Verified: .* @ \K[0-9a-f]{7,40}' || true)
          if [ -n "$PREV_STATUS_SHA" ]; then
            python3 scripts/status_drift.py --repo . \
              --bench-commit "$PREV_STATUS_SHA" --head HEAD \
              --out docs/DRIFT.md || true
            printf '\n' >> docs/STATUS.md
            cat docs/DRIFT.md >> docs/STATUS.md
            cat docs/DRIFT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          cat docs/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: publish to bench/status branch
        run: |
          git config user.name 'bench-status-bot'
          git config user.email 'noreply@amperstrand.no'
          git checkout --orphan bench-status
          git rm -rq --cached . 2>/dev/null || true
          git add docs/STATUS.md
          git commit -qm "bench status @ ${GITHUB_SHA:0:12} [skip ci]"
          git push -q --force origin HEAD:refs/heads/bench/status

  rollup:
    runs-on: ubuntu-latest
    name: rollup comment on tracked issues
    needs: status
    if: always() && needs.status.result == 'success'
    # #183 Phase 2, third bullet: post the generated STATUS.md on
    # tracked hardware-verification issues — ONLY when outcomes changed
    # (status_rollup digests the rows and stays silent on identical
    # nights). Opt-in both directions: the dispatch input above, or the
    # STATUS_ROLLUP_ISSUES repo variable for the nightly (absent
    # variable = silent nightly until the operator opts in). API-only
    # job — it never runs on the bench runner.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: regenerate STATUS.md (publishing stays in the status job)
        run: |
          mkdir -p docs
          inv=$(ls artifacts/bench-inventory/inventory.json 2>/dev/null || true)
          junit=$(ls artifacts/hil-junit/hil-junit.xml 2>/dev/null || true)
          python3 scripts/gen_status.py \
            --inventory "${inv:-/dev/null}" \
            --junit "${junit:-/dev/null}" \
            --commit "$GITHUB_SHA" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: post rollups (opt-in via input or STATUS_ROLLUP_ISSUES)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES="${{ inputs.rollup_issues || vars.STATUS_ROLLUP_ISSUES }}"
          python3 scripts/status_rollup.py --status docs/STATUS.md \
            --repo "$GITHUB_REPOSITORY" --issues "${ISSUES}" \
            --token "$GITHUB_TOKEN"
