# Supply-chain gate (research 2026-10-17): cargo-deny over the root
# workspace — RUSTSEC advisories, license allow-list (exact surface of
# the current tree), duplicate-version trend, and source pinning
# (crates.io + the six deliberate git pins). Config: deny.toml.

name: Deny

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - "vendor/**" # patch-content changes must re-run the gate (#294 fold-in)
      - "vendor-patches/**" # lifecycle artifacts (series/SHA256SUMS) — tripwires re-run (#271)
      - ".github/workflows/deny.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - "vendor/**" # patch-content changes must re-run the gate (#294 fold-in)
      - "vendor-patches/**" # lifecycle artifacts (series/SHA256SUMS) — tripwires re-run (#271)
      - ".github/workflows/deny.yml"
  schedule:
    # weekly: the advisory DB moves even when manifests don't
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      # submodules REQUIRED (AGENTS Gotcha): the [patch] tables carry
      # path deps into vendor/ (stm32f469i-disc) — an empty vendor/
      # checkout breaks cargo metadata (the synopsys path-patch era's
      # first CI run failed exactly there).
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: vendor-patches lifecycle verify (#271)
        # Mechanical half of the retirement triggers documented in
        # docs/vendor-patches.md: (a) the synopsys series must still apply
        # onto the recorded upstream base and reproduce the fork tree —
        # failure means upstream moved (rebase before the owner pastes);
        # (b) the sole-provider BSP snapshot must match its SHA256SUMS —
        # failure means the frozen vendor tree was edited undocumented.
        run: ./vendor-patches/verify.sh
