# Nightly bounded fuzz runs for the three committed cargo-fuzz targets
# (fuzz_atr_parse, fuzz_serial_frame_parser, fuzz_nci_frame_decode —
# mirrors the micronuts fuzz-nightly.yml fleet pattern). Bounded by
# -max_total_time so a nightly costs minutes, not hours; crash
# artifacts are uploaded on failure. Manual legs any time via
# workflow_dispatch.
#
# Toolchain note: nightly is the fleet's ONE documented exception class
# (AGENTS.md "instrumented fuzzing legs" — cargo-fuzz needs
# -Zsanitizer). Do NOT spread nightly to any other job.
#
# RUNNER POLICY (owner direction, 2026-10-28): fuzzing is SELF-HOSTED
# ONLY. GitHub's acceptable-use policy does not prohibit fuzzing on
# hosted runners (this is a cost/value judgement, not a ToS workaround),
# but bounded fuzz is the worst minute-value workload on 4-vCPU hosted
# machines and precisely what the 19-vCPU legion VM exists for. So:
#   legion-vm heartbeat within 24h -> fuzz legs run there, budget
#                                  1800s per target (15x the old hosted
#                                  budget) across per-repo runner
#                                  services on the VM.
#   no heartbeat                   -> fuzz legs SKIP (neutral, not red):
#                                  a missed nightly is preferable to
#                                  burning hosted minutes on the one
#                                  workload we own better hardware for.
# `pick-runner` (a seconds-cheap hosted job) decides by inferring
# availability from EXECUTED jobs — the runners API is admin-only and a
# job token gets HTTP 403 there, and `gh api` has no --argjson; both
# learned the hard way on this PR's earlier dispatches, which is why
# every probe branch now emits a ::notice.
# Security posture unchanged: schedule/dispatch only (origin/main code —
# same doctrine as hil-bench.yml; PR code never runs on a persistent
# runner, and build.rs is untrusted code per boot-smoke). Repo-level
# runners only take jobs for their own repo, so parallel matrix legs
# need one runner service per leg-slot on the VM (machine-class labels
# do NOT pool across registrations).

name: Fuzz Nightly

on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC — staggered off hil-bench (03:17)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pick-runner:
    name: pick runner (fuzz is self-hosted-only)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      lane: ${{ steps.pick.outputs.lane }}
      fuzz_seconds: ${{ steps.pick.outputs.fuzz_seconds }}
    steps:
      - name: Probe legion-vm availability (secret-free)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Availability = "a job executed on a legion-* runner within 24h"
          # (machine-class heartbeat). This repo's own runs first; the
          # kali-live-headless CI lane — same VM, pushed frequently —
          # bootstraps the signal for repos that never ran self-hosted.
          cutoff=$(date -u -d '24 hours ago' +%s)
          case "$cutoff" in ''|*[!0-9]*) echo "::error::bad cutoff"; exit 1 ;; esac
          saw_legion() {
            local repo=$1 pages=$2 runs run verdict
            runs=$(gh api "repos/$repo/actions/runs?per_page=$pages" \
              --jq ".workflow_runs[]
                    | select(.status == \"completed\")
                    | select((.updated_at | fromdateiso8601) > $cutoff)
                    | .id" 2>&1) || {
              echo "::notice::probe $repo listing failed: $(printf '%s' "$runs" | tail -1)"
              return 1
            }
            for run in $runs; do
              verdict=$(gh api "repos/$repo/actions/runs/$run/jobs" \
                --jq 'any(.jobs[]; ((.runner_name // "") | startswith("legion-")))' 2>/dev/null || true)
              if [ "$verdict" = true ]; then
                echo "::notice::probe $repo: run $run executed on a legion-* runner"
                return 0
              fi
            done
            echo "::notice::probe $repo: no legion-* job within 24h"
            return 1
          }
          if saw_legion "${{ github.repository }}" 15 \
             || saw_legion Amperstrand/kali-live-headless 5; then
            echo 'lane=selfhosted' >> "$GITHUB_OUTPUT"
            echo 'fuzz_seconds=1800' >> "$GITHUB_OUTPUT"
          else
            echo 'lane=hosted' >> "$GITHUB_OUTPUT"
            echo 'fuzz_seconds=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Lane summary
        run: |
          {
            echo "## Fuzz lane"
            echo '```'
            echo "lane:         ${{ steps.pick.outputs.lane }}"
            if [ "${{ steps.pick.outputs.lane }}" = selfhosted ]; then
              echo "fuzz budget:  ${{ steps.pick.outputs.fuzz_seconds }}s per target on legion-vm"
            else
              echo "fuzz legs:    SKIPPED — fuzzing is self-hosted-only (no legion-vm heartbeat within 24h)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: ${{ matrix.target }}
    needs: pick-runner
    if: needs.pick-runner.outputs.lane == 'selfhosted'
    runs-on: [self-hosted, legion-vm]
    # Bounds BOTH the leg and the queue-wait on the race where the VM goes
    # away between probe and dispatch (schedule-only lane: a timed-out
    # nightly is noise, not a blocker). 40 min = build + 1800s fuzz +
    # margin.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_atr_parse
          - fuzz_serial_frame_parser
          - fuzz_nci_frame_decode

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep untracked build output on persistent runners (target/,
          # cargo-fuzz artifacts): the warm incremental build is most of
          # the self-hosted win.
          clean: false

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz (bounded ${{ needs.pick-runner.outputs.fuzz_seconds }}s)
        working-directory: fuzz
        run: |
          set +e
          # --target gnu: cargo-fuzz's musl default is ASan-incompatible
          # (statically linked libc) and not preinstalled on the runner.
          #
          # +nightly is LOAD-BEARING: the repo's rust-toolchain.toml pins
          # stable 1.99.0, and rustup gives the TOML precedence over the
          # toolchain dtolnay/rust-toolchain installed — plain `cargo fuzz
          # run` compiled with stable, which rejects -Zsanitizer ("the
          # option `Z` is only accepted on the nightly compiler"; red
          # since the workflow's first run, 2026-10-18). The +toolchain
          # proxy exports RUSTUP_TOOLCHAIN to cargo-fuzz's child cargo
          # invocations, which outranks the TOML.
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=${{ needs.pick-runner.outputs.fuzz_seconds }} -timeout=10
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::group::fuzz artifacts"
            ls -la artifacts/ crash-* timeout-* leak-* oom-* 2>/dev/null || true
            echo "::endgroup::"
          fi
          exit $rc

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/crash-*
            fuzz/timeout-*
            fuzz/leak-*
            fuzz/oom-*
          if-no-files-found: ignore
