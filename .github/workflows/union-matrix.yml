# Workflow: union compile matrix — backend x board x transport x mode
# (kanban t_f579fc05, the build leg of the #308 stamp).
#
# WHY: the #307 lesson — leg-specific breaks land invisibly without a
# matrix. ci.yml builds a curated subset per tier; variants that exist in
# build.sh but in no CI leg (c3-ccid-ble, c3-ccid-ble-diag, wifi-vpcd,
# m5stick-ble, m5stick) only broke on the bench. This workflow
# compile-checks EVERY valid variant: the combo table is GENERATED from
# firmware/esp32-ccid/build.sh (the bench authority) by
# tools/union_matrix.py — one manifest, so the matrix cannot drift from
# build.sh — plus the host-side backend x board half and the ccid-service
# board-blind boundary (t_72e1e2ed, #383).
#
# OPT-IN POLICY (owner decision #366, 2026-10-21 — same shape as ci.yml):
#   pull_request fires ONLY on label-add and only the `ci-run` label lights
#   the jobs up (job-level if => non-ci-run labels skip green); every merge
#   verifies on the push-to-main leg; workflow_dispatch allows manual runs
#   with a combo filter. No schedule lane: ci.yml's nightly full-matrix
#   already rebuilds both tiers.
#
# COST: `cargo check` per combo (not release builds — those stay in
# ci.yml's build jobs), one runner leg per variant, espup toolchain +
# espressif caches shared with ci.yml's keys (restore-keys fall back to
# the build-job entries).
#
# Local equivalent (the make-style entrypoint):
#   tools/union_matrix.py --format table
#   tools/union_matrix.py --format commands --variant <name>

name: union-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      combo-filter:
        description: "Run only variants whose name contains this substring (empty = all)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    # #366 label gate: non-`ci-run` label events short-circuit here
    # (skipped => green; no required checks ride on this workflow yet —
    # add `union-ok` to branch protection when adopting it as required).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci-run'
    runs-on: ubuntu-latest
    outputs:
      esp: ${{ steps.gen.outputs.esp }}
      host: ${{ steps.gen.outputs.host }}
      esp-count: ${{ steps.gen.outputs.esp-count }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # Push legs are path-gated (ci.yml `changes` doctrine): a docs-only
      # merge must not pay for 13 IDF compiles. Labeled PRs (ci-run) and
      # dispatch runs are explicit opt-ins — full matrix, no filtering.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            esp:
              - 'firmware/esp32-ccid/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/union-matrix.yml'
      - name: Validate the combo manifest (features, sdkconfigs, boundary, selftest)
        run: python3 tools/union_matrix.py check
      - name: Generate matrices
        id: gen
        run: |
          ESP_RUNS=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ steps.filter.outputs.esp }}" != "true" ]; then
            ESP_RUNS=false  # docs-only merge: host + boundary legs only
          fi
          {
            if [ "$ESP_RUNS" = "true" ]; then
              echo "esp=$(python3 tools/union_matrix.py --format matrix --filter "${{ inputs.combo-filter }}")"
              echo "esp-count=$(python3 tools/union_matrix.py --format matrix --filter "${{ inputs.combo-filter }}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
            else
              echo "esp=[]"
              echo "esp-count=0"
            fi
            echo "host=$(python3 tools/union_matrix.py --format host-matrix)"
          } >> "$GITHUB_OUTPUT"
      - name: Matrix summary
        run: |
          echo "### union-matrix: ${{ steps.gen.outputs.esp-count }} esp combos" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/union_matrix.py --format table --filter "${{ inputs.combo-filter }}" >> "$GITHUB_STEP_SUMMARY" || true

  esp32-check:
    # The target-side union: cargo check per variant (xtensa + riscv32).
    needs: matrix
    if: needs.matrix.outputs.esp-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.esp) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip python3-venv libssl-dev libffi-dev
          pip install --user pyelftools

      - name: Install ldproxy
        run: cargo install ldproxy

      # Same pins + cache key as ci.yml esp32-build (one-Rust-version policy:
      # espup fork 1.98.1.0 meets the 1.98 rust-version floor).
      - name: Cache esp Rust toolchain (espup pins)
        id: esp_toolchain_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp*
            ~/export-esp.sh
          key: espup-toolchain-v1-v1.98.1.0-c14.2.0_20260121

      - name: Install espup
        if: steps.esp_toolchain_cache.outputs.cache-hit != 'true'
        run: cargo install espup

      # `-check` suffix keeps this job's saves separate from ci.yml's build
      # entries; the restore chain falls back to the build-job keys so a
      # warm IDF build is reused across the two workflows (same v7
      # generation — same IDF pin, same crosstool).
      - name: Cache espressif tools + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            target
            .embuild
          key: espressif-${{ runner.os }}-v7-${{ matrix.name }}-${{ matrix.target }}-check-${{ hashFiles('firmware/esp32-ccid/Cargo.toml', '**/Cargo.lock', 'firmware/esp32-ccid/sdkconfig*', 'firmware/esp32-ccid/partitions-ota.csv', 'rust-toolchain.toml') }}
          restore-keys: |
            espressif-${{ runner.os }}-v7-${{ matrix.name }}-${{ matrix.target }}-check-
            espressif-${{ runner.os }}-v7-${{ matrix.name }}-${{ matrix.target }}-
            espressif-${{ runner.os }}-v7-${{ matrix.name }}-

      - name: Install ESP toolchain (pinned fork + crosstool)
        if: steps.esp_toolchain_cache.outputs.cache-hit != 'true'
        run: |
          espup install -c 14.2.0_20260121 -v 1.98.1.0 --targets esp32,esp32c3
          . "${HOME}/export-esp.sh"
          rustup component add rustfmt --toolchain esp || true

      - name: cargo check (${{ matrix.name }})
        working-directory: firmware/esp32-ccid
        run: |
          . "${HOME}/export-esp.sh"
          # sdkconfig env mirrors ci.yml esp32-build: the .full configs must
          # reach esp-idf-sys or variant modules (bt/spp/wifi) do not exist
          # in the IDF build and the check fails for the wrong reason.
          if [ "${{ matrix.sdkconfig_full }}" = "true" ]; then
            export ESP_IDF_SDKCONFIG="$PWD/${{ matrix.sdkconfig }}"
            export ESP_IDF_GLOB_PARTCSV_BASE="$PWD"
            export ESP_IDF_GLOB_PARTCSV_1="/partitions-ota.csv"
          else
            export ESP_IDF_SDKCONFIG_DEFAULTS="$PWD/${{ matrix.sdkconfig }}"
          fi
          if [ "${{ matrix.no_default_features }}" = "true" ]; then
            cargo +esp check --target ${{ matrix.target }} --no-default-features --features "${{ matrix.features }}"
          else
            cargo +esp check --target ${{ matrix.target }}
          fi

  host-union-check:
    # The host-side half of the union: backend x board (x vpcd transport)
    # combos compiled on x86_64 — no IDF, no esp toolchain, seconds per
    # leg. Guards the feature-union surface of the esp32-ccid crate itself.
    needs: matrix
    if: needs.matrix.outputs.esp-count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.host) }}
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check (${{ matrix.name }})
        run: >-
          cargo check -p esp32-ccid --target x86_64-unknown-linux-gnu
          --no-default-features --features "${{ matrix.features }}"

  service-boundary:
    # ccid-service (t_72e1e2ed, PR #383) is the board-blind serving kernel:
    # deps ONLY card-interface/ccid-core/ccid-protocol/ccid-transport-serial
    # (+ heapless/log). `union_matrix.py check` asserts the allowlist at
    # the manifest edge; this job compile- and lint-checks the crate itself
    # so the union's serving seam cannot rot behind the matrix.
    needs: matrix
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu
          components: clippy
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check + clippy (ccid-service, zero warnings)
        run: |
          cargo check -p ccid-service --target x86_64-unknown-linux-gnu
          cargo clippy -p ccid-service --target x86_64-unknown-linux-gnu -- -D warnings

  union-ok:
    # Aggregator (same contract as ci.yml's ci-ok): runs even when something
    # failed so a red run can never report green; skipped legs count green.
    needs: [matrix, esp32-check, host-union-check, service-boundary]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: All union-matrix jobs succeeded or skipped
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "needs results: $results"
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::one or more union-matrix jobs failed or were cancelled"
            exit 1
          fi
