[package]
name = "esp32-ccid"
rust-version = "1.98"
version = "0.1.0"
edition = "2021"
description = "ESP32 + PN532 CCID-over-serial firmware (GemPC Twin emulation)"
license = "GPL-2.0-or-later"

[[bin]]
name = "esp32-ccid"
path = "src/main.rs"

[lib]
name = "esp32_ccid"
path = "src/lib.rs"

[features]
default = ["backend-mfrc522", "board-m5atom"]
# #149 P3: the MFRC522 frontend rides the shared driver_ng embedded-hal
# adapter (`pn7160_nci::hal_i2c`) — the legacy esp-idf-hal i2c gate and
# the vendored-hal `legacy-i2c` opt-in are retired with this wiring.
backend-mfrc522 = ["dep:mfrc522", "dep:iso14443", "dep:mfrc522-pcd", "dep:pn7160-nci", "pn7160-nci/esp"]
backend-pn532 = ["dep:pn532", "dep:pn532-transport"]
# Grove I2C pinout — pin data lives in `crates/boards` (boards-as-data,
# design §4 step 1): do not add pin numbers here. board-m5stick reads
# `boards::M5STICK`; board-m5atom / board-nucula migrate in later slices
# (bolty-rs docs/lessons-learned.md B2 remains the provenance citation).
board-m5atom = []
board-m5stick = []
# ESP32-C3 nucula board: PN7160 NFC @ I2C addr 0x28, SDA=GPIO4 SCL=GPIO5 IRQ=GPIO6 VEN=GPIO7.
# Console is the ROM USB-Serial/JTAG CDC (GPIO18/19); there is no UART bridge.
# NOTE: the PN7160 backend driver is a later phase; this feature only selects the
# board pin mapping so the firmware compiles for riscv32imc-esp-espidf.
board-nucula = []
backend-pn7160 = ["dep:pn7160-nci", "pn7160-nci/esp"]
pn7160-bringup = ["backend-pn7160", "board-nucula", "bench-net"]
# Bench network facilities — the surfaces an untrusted network must never
# reach (#219, D-8): the TCP OTA flash server (:3232), the UDP netlog
# broadcast arm (:4567), and the serial mains' NUCULA_WIFI_*-creds STA
# bring-up. DEFAULT OFF — shipped builds compile none of them; bench
# builds opt in via build.sh, and the OTA-seat boards ride it for
# ota_push.py. The authenticated OTA2/token form (ota_header) exists;
# arming tokens on bench builds is the tracked follow-up.
bench-net = []
pn7160-verdict-a = []
pn7160-verdict-b = []
# Experiment: never cycle VEN — assumes the chip is alive at handover
# forwards into the shared crate (package-scoped features, Codex #230)
pn7160-ven-never = ["pn7160-nci/ven-never"]
pn7160-verdict-c = []
pn7160-ccid = ["backend-pn7160", "board-nucula"]
# WiFi TCP transport — the board's application port (#117 workaround by
# design): GemPC CCID over TCP :29443, host bridges with socat PTY↔TCP.
wifi-ccid = ["backend-pn7160", "board-nucula"]
# vpcd reversed-connection transport (the primary wifi path) — composes
# with any backend+board pair; no NFC backend of its own:
#   nucula:  wifi-vpcd,backend-pn7160,board-nucula   (build.sh wifi-vpcd)
#   m5atom:  wifi-vpcd,backend-mfrc522,board-m5atom
#   m5stick: wifi-vpcd,backend-mfrc522,board-m5stick (build.sh m5stick-vpcd)
wifi-vpcd = []
# Wire-level instrument + NCI-over-GPIO fallback (issues #63/#80).
pn7160-bitbang = ["backend-pn7160", "board-nucula"]
# M1 milestone: minimal bus+probe, nothing else (issues #63/#80).
pn7160-m1 = ["backend-pn7160", "board-nucula"]
pn7160-v10raw = ["backend-pn7160", "board-nucula"]
pn7160-actdiag = ["backend-pn7160", "board-nucula"]
# M5StickC-**Plus** LCD status screen (bolty-rs display.rs port) —
# Plus-only (#275: the pinned ST7789 135x240 geometry mis-drives an
# original M5StickC's ST7735S panel; per-model selection is tracked
# follow-up). mipidsi/embedded-graphics pinned to bolty's exact proven
# pair. The AXP192 PMU rides the same #149 P3 driver_ng adapter as the
# MFRC522 backend (m5stick_lcd.rs `imp` module).
lcd = ["dep:mipidsi", "dep:embedded-graphics", "dep:pn7160-nci", "pn7160-nci/esp"]
ble = []
# DIAGNOSTIC-ONLY BLE variant (issue #165): keeps C-level ESP_LOGx/BT
# stack traces UNSILENCED on the console (the standard `ble` build
# silences them — clean-wire doctrine). Pair ONLY with
# `sdkconfig-c3-ble-diag.full` via build.sh `c3-ccid-ble-diag`. The
# extra console output is this build's purpose — it must NEVER become a
# serving build.
ble-diag = ["ble"]
# pcscd over Bluetooth Classic SPP: RFCOMM replaces UART0 as the GemPC CCID
# wire (console moves to UART0, logs stay on). REQUIRES the classic-BT+SPP
# sdkconfig (`sdkconfig-xtensa-spp.full`) — a mismatched pair fails loudly
# at the esp-idf-svc `bt::spp` imports, same compile-loud pairing rule as
# `ble`. ESP32 silicon only (BR/EDR). Mutually exclusive with `ble` (modem).
spp = []
# M3 product preset (t_0492b7c6, products.toml provisioner-min): kernel +
# NFC frontend + the bolty-core provisioner app (card burn / wipe /
# derive-keys). The app module is NOT vendored here — it lands as a
# rev-pinned git dep from bolty-rs in a follow-up PR (one-way-kernel
# doctrine, M2). Until it lands this feature is the composition marker:
# `build.sh product=provisioner-min` compiles the exact kernel+frontend
# surface the app mounts on (src/provisioner_app.rs is the mount point),
# so the preset and its CI artifact leg are real today.
provisioner = []

[dependencies]
card-interface = { path = "../../crates/card-interface" }
# Board tables as const data (boards-as-data pilot): the board-m5stick
# wiring reads `boards::M5STICK` — never inline pin numbers.
boards = { path = "../../crates/boards" }
ccid-core = { path = "../../crates/ccid-core" }
ccid-protocol = { path = "../../crates/ccid-protocol" }
ccid-service = { path = "../../crates/ccid-service" }
ccid-transport-serial = { path = "../../crates/ccid-transport-serial" }
embedded-hal = "1.0"
heapless = "0.9"
log = "0.4"
nb = "1.1"
mfrc522 = { git = "https://github.com/Amperstrand/mfrc522-rs.git", rev = "e9ced1e", optional = true }
iso14443 = { git = "https://github.com/Amperstrand/iso14443-rs.git", rev = "0f7d9d70", features = ["alloc"], optional = true }
# Transceiver bridge + bus recovery shared with bolty-rs; only the
# backend-mfrc522 feature pulls it (dep: wiring keeps PN7160/PN532 builds
# from compiling — and warning about — an unused git dependency.
mfrc522-pcd = { path = "../../crates/mfrc522-pcd", optional = true }
pn7160-nci = { path = "../../crates/pn7160-nci", optional = true }
pn532 = { version = "0.5.0", features = ["msb-spi"], default-features = false, optional = true }
pn532-transport = { git = "https://github.com/Amperstrand/bolty-rs.git", rev = "2a1afea", optional = true }

# LCD status screen (bolty-rs display.rs port) — pinned to bolty's exact
# bench-proven pair (apps/bolty-esp32/Cargo.toml):
mipidsi = { version = "=0.9.0", optional = true }
embedded-graphics = { version = "=0.8.2", optional = true }

# ESP-IDF is used on both Xtensa (ESP32/S2/S3) and RISC-V (ESP32-C3/C2/C6/H2).
[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
esp-idf-sys = { version = "0.38", features = ["binstart"] }
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
# v5.5.5 (2026-10-12 unification bump from v5.5.1): requires crosstool
# esp-14.2.0_20260121 (exact build-string tool_version_check). 2026-10-15
# wave: svc 0.53 + sys 0.38 + hal-fork rebased on v0.47.0 — the legacy-I2C
# lane closed (fork branch ai-experiments-0.47).
esp_idf_version = "tag:v5.5.5"

