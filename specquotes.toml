# greatspectations spec-quote drift config for ccid-firmware-rs
#
# Tool: https://github.com/rustyrussell/greatspectations
#
# The USB CCID Rev 1.1 specification itself is a PDF with no canonical
# text source. The closest tracked text sources are used instead:
#
#   CCID_SPEC   — osmo-ccid-firmware protocol definitions (CCID Rev 1.1
#                 message types, structures, status/error constants)
#   CCID_SERIAL — libccid's GemPC Twin serial driver (framing, echo,
#                 escape commands, descriptor values)
#   GEMPC       — the authoritative GemPC Twin serial reader descriptor
#   PCSC        — pcsc-lite's host-side PIN structures: what pcscd
#                 actually puts in PC_to_RDR_Secure payloads
#   LIBCCID     — libccid's PC/SC → CCID byte translation loops (the
#                 on-wire field order/omission rules)
#   ISO7816     — osmo's ISO 7816-3 tables (@implements annotations),
#                 the Fi/Di/fmax authority for ATR parsing
#   CCID_DEFS   — libccid's driver structures/constants (ccid.h): the
#                 GEMALTO_FIRMWARE_FEATURES layout the 0x6A escape answers
#   PCSCD       — pcscd's daemon constants (pcscd.h.in): poll cadence,
#                 power-off grace, event timeouts (#141 host contract)
#
# All live in git submodules under reference/ (CI checks out with
# submodules: true; locally run `git submodule update --init` first).
#
# Comment marker syntax in Rust source:
#   // CCID_SPEC:   <verbatim quote from ccid_proto.h>
#   // CCID_SERIAL: <verbatim quote from ccid_serial.c>
#   // GEMPC:       <verbatim quote from GemPCTwinSerial.txt>
#   // PCSC:        <verbatim quote from reference/CCID/MacOSX/reader.h>
#   // LIBCCID:     <verbatim quote from reference/CCID/src/commands.c>
#   // ISO7816:     <verbatim quote from iso7816_3.c>
#
# Run (from repo root):
#   python3 -m greatspectations check --config specquotes.toml \
#       --comment-start '// ' --comment-continue '//' -k \
#       $(git ls-files 'crates/*/src/*.rs' 'firmware/*/src/*.rs')
#
# Quotes are whitespace-normalized: consecutive `//` continuation lines
# join into one quote, `...` acts as a wildcard. Keep quote blocks
# separated from other comments by a blank line.

[sources.CCID_SPEC]
format = "markdown"
file = "reference/osmo-ccid-firmware/ccid_common/ccid_proto.h"
comment_marker = "CCID_SPEC"

[sources.CCID_SERIAL]
format = "markdown"
file = "reference/CCID/src/ccid_serial.c"
comment_marker = "CCID_SERIAL"

[sources.GEMPC]
format = "markdown"
file = "reference/CCID/readers/GemPCTwinSerial.txt"
comment_marker = "GEMPC"

[sources.PCSC]
format = "markdown"
file = "reference/CCID/MacOSX/reader.h"
comment_marker = "PCSC"

[sources.LIBCCID]
format = "markdown"
file = "reference/CCID/src/commands.c"
comment_marker = "LIBCCID"

[sources.ISO7816]
format = "markdown"
file = "reference/osmo-ccid-firmware/ccid_common/iso7816_3.c"
comment_marker = "ISO7816"

# T=1 protocol engine the HOST actually runs (libccidtwin terminates the
# serial GemPC-Twin dialect with this code): PCB bit-position macros and
# build/receive validation rules — the implementation authority for the
# serial dialect's I/R/S block encodings (docs/t1_pcb_layout_audit.md).
[sources.T1]
format = "markdown"
file = "reference/CCID/src/openct/proto-t1.c"
comment_marker = "T1"

# Same engine, header side (#142 G-01 quote-lock): the block-type PCB
# prefixes (T1_I_BLOCK/T1_R_BLOCK/T1_S_BLOCK) and the host engine's own
# block buffer ceiling — T1_BUFFER_SIZE (3 + 254 + 2) pins the 254-octet
# INF maximum the host will ever frame (G-03's IFS ceiling cross-cite).
[sources.T1_H]
format = "markdown"
file = "reference/CCID/src/openct/proto-t1.h"
comment_marker = "T1_H"

# ST USB CCID smartcard template (#142 G-01 quote-lock): the second,
# INDEPENDENT implementation for the Table-45 PCB layout — every macro
# carries its bit-position comment (N(R) position (b5), N(S) position
# (bit 7)), the triangulation partner of openct per
# docs/t1_pcb_layout_audit.md.
[sources.ST_T1]
format = "markdown"
file = "reference/ST/stm32-mw-usb-device/Class/CCID/Inc/usbd_ccid_smartcard_template.h"
comment_marker = "ST_T1"

# Our canonical ISO 14443 fork, quote-only excerpt (#142 G-04): the
# ISO-DEP (14443-4 §7.3) WTXM 1..59 range check — the NFC-side
# cross-cite locking the T=1 WTX multiplier's 59 ceiling. (Marker is
# ISODEP, not ISO14443: mfrc522_driver.rs carries pre-existing prose
# comments that begin with the bare string "ISO14443".)
[sources.ISODEP]
format = "markdown"
file = "reference/iso14443-rs/protocol-wtx.rs"
comment_marker = "ISODEP"

# Kernel NCI header (#142 NCI quote completion): the doctrinal constant
# set for everything crates/pn7160-nci emits/parses — status codes,
# opcodes, RF technologies/protocols/interfaces, deactivation types,
# the 1-octet-param-ID set_config struct, the activation-NTF layout.
# Quote-only vendored under reference/linux-nci/ (pin in PROVENANCE.md).
[sources.NCI_KERN]
format = "markdown"
file = "reference/linux-nci/nci.h"
comment_marker = "NCI_KERN"

# Kernel NCI core.c, trimmed to the nci_rx_work MT dispatch (#142): the
# RX-side "unknown MT" drop behind pn7160-nci's Frame::decode RFU-MT
# rejection.
[sources.NCI_CORE]
format = "markdown"
file = "reference/linux-nci/core.c"
comment_marker = "NCI_CORE"

# NXP production NCI headers (#142 NCI quote completion): the silicon's
# own tables — 1-octet param IDs (the founding incident), ISO-DEP max
# info 253, the NCI 2.x deactivate-reason table (bench-captured on the
# PN7160, PR #542), RF_WTX 0x17, listen-config param IDs.
[sources.NCI_DEFS]
format = "markdown"
file = "reference/nxp-nci/nci_defs.h"
comment_marker = "NCI_DEFS"

# PDF-only authority (UM11495 Rev 1.8): quotes are transcribed verbatim
# into the tracked markdown below (docs/quote-sources/ policy, #140/#156).
[sources.UM11495]
format = "markdown"
file = "docs/quote-sources/um11495-quotes.md"
comment_marker = "UM11495"

# M5Stack/sipeed AXP192 reference implementations (m5stick_lcd battery
# decode + power-path registers, issue #275): same quote-source policy —
# the AXP192 datasheet is PDF-only, the official Arduino ports are the
# tracked text.
[sources.M5AXP]
format = "markdown"
file = "docs/quote-sources/m5stack-axp192-quotes.md"
comment_marker = "M5AXP"

[sources.CCID_DEFS]
format = "markdown"
file = "reference/CCID/src/ccid.h"
comment_marker = "CCID_DEFS"

# PC/SC ↔ CCID translation layer (ifdhandler.c): the host-side
# parameter/timeout decisions driven by our descriptors and ATRs
# (#136 — BWT/readTimeout computation, TPDU exchange-level routing).
[sources.IFDHANDLER]
format = "markdown"
file = "reference/CCID/src/ifdhandler.c"
comment_marker = "IFDHANDLER"

# osmo's slot state machine (CCID_SLOT_FSM): the free-software
# reference for contact-slot failure shapes — the WTIME_EXP → FAILED
# DataBlock + ICC_MUTE shape the #136 error-map table's Mute entry
# cites (ccid_gen_data_block(ccid_seq, CCID_CMD_STATUS_FAILED,
# CCID_ERR_ICC_MUTE, ...)).
[sources.OSMO_FSM]
format = "markdown"
file = "reference/osmo-ccid-firmware/ccid_common/ccid_slot_fsm.c"
comment_marker = "OSMO_FSM"

[sources.PCSCD]
format = "markdown"
file = "reference/pcsc-lite/src/pcscd.h.in"
comment_marker = "PCSCD"

# ST F4 HAL smartcard driver (issue #135, quote-only vendored under
# reference/ST/ — Apache-2.0, pin in reference/ST/PROVENANCE.md): the
# smartcard-mode framing contract — STOP bits (0.5/1.5 ONLY, the assert
# behind the T=1 STOP=1.0 violation fix), NACK state macros, guard-time
# programming (GuardTime<<8 into GTPR, baud-clock units), BRR math/ceiling.
[sources.ST_HAL]
format = "markdown"
file = "reference/ST/stm32f4xx-hal-driver/Inc/stm32f4xx_hal_smartcard.h"
comment_marker = "ST_HAL"

# Same driver, .c side (trimmed): HAL_SMARTCARD_Init (GTPR/NACK/SCEN
# sequence), SMARTCARD_SetConfig (CR2 STOP + BRR), the RM0090 pointers and
# the recommended ATR configuration (9 bits / 1.5 stop / even parity).
[sources.ST_HAL_C]
format = "markdown"
file = "reference/ST/stm32f4xx-hal-driver/Src/stm32f4xx_hal_smartcard.c"
comment_marker = "ST_HAL_C"

# osmoOCTSIM's SAMD51 ISO 7816 USART config (already a submodule): the
# reference free-software reader's guard-time (2-bit times) and NACK
# (INACK=0, NACK transmitted on parity error) policy choices.
[sources.OSMO_7816]
format = "markdown"
file = "reference/osmo-ccid-firmware/sysmoOCTSIM/config/hpl_sercom_config.h"
comment_marker = "OSMO_7816"

# ST USB Device Library CCID class (issue #138, quote-only vendored under
# reference/ST/): what a commercial STM32 CCID reader implements —
# descriptor defaults, TPDU exchange-level choice, message-length ceiling,
# and the bulk-OUT short-packet/exact-length/ZLP transfer state machine.
[sources.ST_CCID]
format = "markdown"
file = "reference/ST/stm32-mw-usb-device/Class/CCID/Inc/usbd_ccid.h"
comment_marker = "ST_CCID"
