## Bench exporter: ai-legion NFC/CCID testbed (deploy to /etc/labgrid/)
##
## Doctrine (AGENTS.md "Labgrid bench doctrine"):
##   - labgrid coordinates hardware (places + acquisition)
##   - pcscd owns logical reader access (tests select by USB serial, never
##     enumeration order)
##   - DUTs and reference readers are DISJOINT by identity: our F469
##     Cherry-emulation carries USB serial ST2XXX-001; the authentic bench
##     readers (ACR1252, CardMan 3121) can never match it.
##
## Matches are stable across reboots: serials where the device has one,
## physical USB path (bus port) for serial-less devices.

## --- DUTs -----------------------------------------------------------------

nucula-c3:
  SerialPort:
    port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:DA:72:9A:50:18-if00
    speed: 115200

m5stick-usb:
  SerialPort:
    port: /dev/serial/by-id/usb-Hades2001_M5stack_49D6163EBE-if00-port0
    speed: 115200

### F469-DISCO SWD flash + console (ST-LINK V2.1 CDC; serial is IN the
## by-id path — stable without a udev match)
## ⚠️ 2026-10-14: the F469's ST-LINK is PHYSICALLY DETACHED from the bench
## host — this resource (and the stm32-ccid place) is a phantom until the
## board is re-attached. Kept in the config so the wiring is not lost.
stm32f469-stlink:
  SerialPort:
    port: /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066FFF515786534867184152-if02
    speed: 115200

## The F469 CCID firmware enumerating as Cherry ST-2xxx. The serial
## ST2XXX-001 is OUR firmware's iSerial — the DUT identity marker.
stm32f469-ccid:
  USBDevice:
    match: 'ID_VENDOR_ID=046a ID_MODEL_ID=003e ID_SERIAL_SHORT=ST2XXX-001'

### F746-DISCO (GPIO bitbang smartcard path) — second STM32 DUT, wired
## 2026-10-12. Bench-distinct iSerial ST2XXX-F746 (commit 0af0fb0).
## ST-LINK only — the user USB (046a enumeration) still needs the plug.
stm32f746-stlink:
  SerialPort:
    port: /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066EFF3837334D4E43123327-if02
    speed: 115200

stm32f746-ccid:
  USBDevice:
    match: 'ID_VENDOR_ID=046a ID_MODEL_ID=003e ID_SERIAL_SHORT=ST2XXX-F746'

## --- reference readers (comparison oracles; never DUTs) -------------------

## ACS ACR1252: RETIRED from this exporter 2026-10-25 — the reader moved
## to ai-legion-small (place ref-acr1252-small, exported by that host's
## labgrid-exporter-nfc-small.service; retirement recorded in its place
## note, #71). Do NOT re-add here: the coordinator place no longer exists
## and re-exporting would resurrect a phantom place with no hardware.

## OmniKey CardMan 3121: reference contact reader. Serial-less: physical port.
ref-cardman:
  USBDevice:
    match: 'ID_VENDOR_ID=076b ID_MODEL_ID=3021 ID_PATH=pci-0000:00:14.0-usb-0:11'
