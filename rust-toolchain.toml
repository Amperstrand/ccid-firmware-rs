# Single toolchain authority for host crates + STM32 firmware (issue #115
# + the 2026-10-12 split-authority outage). rustup activates this override
# for every invocation at/below the repo root and installs the declared
# components/targets on demand — CI (dtolnay action), the release Docker
# build, and fresh clones all resolve the SAME complete toolchain.
#
# ESP32 targets deliberately live OUTSIDE this file: a single channel
# cannot express the per-board split. BOTH esp32 targets (xtensa AND
# C3) ride the pinned esp fork — espup `esp` toolchain v1.98.1.0 with
# crosstool esp-14.2.0_20260121 (one vendor-frozen compiler carrying
# the same version NUMBER as the stable pin; zero upstream nightlies).
# Selected by firmware/esp32-ccid/build.sh (RUSTUP_TOOLCHAIN) and CI's
# explicit `cargo +<toolchain>`, both of which override this file. The
# exact version string "1.99.0" must match ci.yml's dtolnay
# pin — "1.99" and "1.99.0" are DISTINCT toolchains to rustup. 1.99.0 =
# current stable (2026-09-28), the bench's installed stable (local↔CI
# parity); 1.92.0 was retired because modern tooling (espflash 4.x et al)
# no longer builds under it.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["thumbv7em-none-eabihf"]
